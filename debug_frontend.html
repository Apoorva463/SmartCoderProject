<!DOCTYPE html>
<html>
<head>
    <title>Frontend Debug Test</title>
</head>
<body>
    <h1>Frontend Debug Test</h1>
    <button onclick="testAPI()">Test API Direct</button>
    <button onclick="testHealth()">Test Health</button>
    <div id="output"></div>

    <script>
        async function testHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                document.getElementById('output').innerHTML = '<pre>Health: ' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('output').innerHTML = '<pre>Health Error: ' + error.message + '</pre>';
            }
        }

        async function testAPI() {
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: 'https://httpbin.org/html',
                        query: 'blacksmith melville'
                    })
                });
                
                const data = await response.json();
                document.getElementById('output').innerHTML = '<pre>API Response:\n' + JSON.stringify(data, null, 2) + '</pre>';
                console.log('Direct API test results:', data.results ? data.results.length : 0);
            } catch (error) {
                document.getElementById('output').innerHTML = '<pre>API Error: ' + error.message + '</pre>';
            }
        }
    </script>
</body>
</html>
